# DreamWeave's organization site. GitHub Pages substitutes the final URL in CI when needed.
base_url = "https://DreamWeave-MP.github.io"
title = "DreamWeave"
description = "Software modernization, runtime engineering, performance work, and tools for codebases that are difficult to change."

compile_sass = true
build_search_index = true
generate_feeds = true
feed_filenames = ["atom.xml"]
taxonomies = [{ name = "tags", feed = false }]

[search]
index_format = "fuse_json"
include_title = true
include_description = true
include_content = true
truncate_content_length = 400

[markdown]
highlighting = { theme = "dracula-soft" }
insert_anchor_links = "right"
smart_punctuation = true

[slugify]
paths = "safe"

[link_checker]
skip_prefixes = ["https://github.com/"]

[extra]
github_username = "DreamWeave-MP"
github_project = "DreamWeave-MP.github.io"

logo_text = "DreamWeave"
logo_home_link = "/"
footer_text = "DreamWeave · Difficult software is still software."
palette = "purple"
font_override = "oxanium"
font_override_titles_only = true

menu_items = [
    { name = "Services", url = "@/services/_index.md" },
    { name = "Engineering", url = "@/engineering/_index.md" },
    { name = "Field Reports", url = "@/field-reports/_index.md" },
    { name = "Dispatches", url = "@/dispatches/_index.md" },
    { name = "Contact", url = "@/contact.md" },
]

[extra.comments]
enabled = false
category = "General"
